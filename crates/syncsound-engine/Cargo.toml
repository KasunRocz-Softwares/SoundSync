[package]
name = "syncsound-engine"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KasunRocz-Softwares/SoundSync"

[dependencies]

crossbeam-queue = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Media_KernelStreaming", "Win32_System_Threading", "Win32_Security"] }
windows-core = "0.62"
